name: Package Application

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup environment
      uses: ./.github/actions/setup
      with:
        install-type: prod
      
    - name: Build package
      run: make package
      
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crab-compensation-package
        path: |
          dist/*.whl
          dist/dependencies.zip
        retention-days: 7